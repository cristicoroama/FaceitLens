<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No font <link>. Typography is Bootstrap 5's system stack, declared in
         index.css — Bootstrap ships no webfont, so there is nothing to fetch
         and no render-blocking request to a font CDN. -->
    <title>Faceit-Lens — FACEIT CS2 Stats, ELO Tracker & Account Checker</title>
    <meta name="description" content="Look up any FACEIT CS2 player: ELO, level, win rate, K/D, map stats and match history. Plus an account trust score to spot smurfs, inventory value, Leetify demo stats, a match-room analyzer and pro player settings." />
    <meta name="keywords" content="faceit finder, faceit tracker, cs2 stats, faceit elo, cs2 tracker, faceit stats checker, smurf checker, cs2 account checker, faceit level, cs2 smurf detector, faceit account linking" />
    <link rel="canonical" href="https://faceit-lens.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Discord / WhatsApp / Twitter link previews) -->
    <meta property="og:title" content="Faceit-Lens — FACEIT CS2 Stats & Account Checker" />
    <meta property="og:description" content="Scan any CS2 player: ELO, K/D, trust score, inventory, Leetify stats and a match-room analyzer — all on one page." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Faceit-Lens" />
    <meta property="og:url" content="https://faceit-lens.com/" />
    <meta property="og:image" content="https://faceit-lens.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Faceit-Lens — FACEIT CS2 Stats & Account Checker" />
    <meta name="twitter:description" content="Scan any CS2 player: ELO, K/D, trust score, inventory, Leetify stats and a match-room analyzer — all on one page." />
    <meta name="twitter:image" content="https://faceit-lens.com/og.png" />

    <!-- Structured data: helps Google show a rich result + search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Faceit-Lens",
      "url": "https://faceit-lens.com/",
      "description": "FACEIT CS2 stats tracker, ELO checker and account trust score.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://faceit-lens.com/player/{search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
