<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No font <link>. Typography is Bootstrap 5's system stack, declared in
         index.css — Bootstrap ships no webfont, so there is nothing to fetch
         and no render-blocking request to a font CDN. -->
    <meta name="keywords" content="faceit analyser, faceit analyzer, faceit match room analyser, faceit finder, faceit tracker, cs2 stats, faceit elo, cs2 tracker, faceit stats checker, smurf checker, cs2 account checker, faceit level, cs2 smurf detector" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta property="og:site_name" content="Faceit-Lens" />

    <!-- SEO:START — everything between these markers is per-page.
         `scripts/prerender.mjs` rewrites it at build time for the tool pages,
         and `api/render.js` rewrites it per request for /player/:nick. What is
         written here is the homepage's own version, which is what "/" serves.

         Do not hardcode a canonical outside this block. A canonical in the
         shared shell applies to every route the SPA serves, so a homepage
         canonical here told Google that every player profile and every tool
         page was really just "/" — and Google indexed none of them. If the
         markers are removed, the injectors fail loudly rather than silently
         serving the wrong tags; that is deliberate. -->
    <title>FACEIT Analyser — CS2 Stats &amp; Smurf Checker | Faceit-Lens</title>
    <meta name="description" content="Free FACEIT analyzer for CS2. Check any player's ELO, win rate, K/D and map stats, or paste a match room link to analyse all 10 players and spot smurfs." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://faceit-lens.com/" />
    <meta property="og:title" content="FACEIT Analyser — CS2 Stats, ELO &amp; Smurf Checker" />
    <meta property="og:description" content="Free FACEIT analyzer for CS2. Check any player's ELO, K/D and map stats, or paste a match room link to analyse all 10 players and spot smurfs." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://faceit-lens.com/" />
    <meta property="og:image" content="https://faceit-lens.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FACEIT Analyser — CS2 Stats, ELO &amp; Smurf Checker" />
    <meta name="twitter:description" content="Free FACEIT analyzer for CS2. Check any player's ELO, K/D and map stats, or paste a match room link to analyse all 10 players and spot smurfs." />
    <meta name="twitter:image" content="https://faceit-lens.com/og.png" />
    <!-- SEO:END -->

    <!-- Structured data: helps Google show a rich result + search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Faceit-Lens",
      "url": "https://faceit-lens.com/",
      "description": "FACEIT CS2 stats tracker, ELO checker and account trust score.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://faceit-lens.com/player/{search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- The block between the BODY markers is the page's heading and intro in
         its own language, written here at build time. React replaces it the
         moment it mounts, and renders the same words again — this is the copy
         a crawler reads before any JavaScript runs.

         It has to exist because Google decides a page's language from visible
         text, not from <title>. A Russian title over an English body gets
         filed as English and never answers a Russian query, which would make
         the whole translation pointless. -->
    <div id="root"><!-- SEO:BODY --><!-- /SEO:BODY --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
